<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Proyek – Pembangunan Jalan KIPP 1A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#dc2626;--blue:#1d4ed8;--teal:#0284c7;--gold:#f59e0b;
  --bg:#f1f5f9;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --shadow:0 4px 20px -2px rgba(15,23,42,.06), 0 2px 6px -1px rgba(15,23,42,.04);
}
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",monospace}

/* Header */
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 32px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;
  border-bottom:4px solid var(--gold);position:relative;
}
header img{height:64px;max-width:240px;object-fit:contain;background:#fff;padding:6px 12px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hl{display:flex;gap:12px;align-items:center}
.ttl{text-align:center;flex:1;min-width:260px}
.ttl .a{font-size:clamp(16px,2vw,22px);letter-spacing:3px;color:var(--gold);font-weight:700;text-transform:uppercase}
.ttl .b{font-size:clamp(22px,3.4vw,40px);font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:-0.5px}

/* Quick Nav */
nav.qnav{
  position:sticky;top:0;z-index:8;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
}
nav.qnav a{
  text-decoration:none;color:var(--ink);font-weight:700;font-size:12.5px;padding:6px 14px;
  border-radius:99px;background:#f8fafc;border:1px solid var(--border);transition:.2s;
}
nav.qnav a:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Grid & Cards */
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:24px;padding:28px 28px 90px;max-width:1680px;margin:auto}
.card{
  background:var(--card);border-radius:18px;padding:24px;box-shadow:var(--shadow);
  border:1px solid var(--border);position:relative;transition:transform .25s ease,box-shadow .25s ease;
}
.card:hover{box-shadow:0 12px 28px -4px rgba(15,23,42,.1)}
.wide{grid-column:1/-1}

/* Modern Badge Header */
.rb{
  display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;
  background:var(--red);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:1.2px;
  padding:6px 16px;border-radius:8px;text-transform:uppercase;box-shadow:0 3px 10px rgba(220,38,38,.25);
}
.rb.b{background:var(--blue);box-shadow:0 3px 10px rgba(29,78,216,.25)}
.rb.g{background:var(--teal);box-shadow:0 3px 10px rgba(2,132,199,.25)}

/* Info Key-Value */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:768px){.two{grid-template-columns:1fr}}
.kv{padding:10px 14px;background:#f8fafc;border-radius:10px;margin-bottom:10px;border-left:3px solid var(--red)}
.two > div:last-child .kv{border-left-color:var(--blue)}
.kv b{display:block;color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
.kv div{white-space:pre-line;font-weight:600;color:var(--ink)}

/* Item Grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.it{
  position:relative;text-align:center;font-size:12.5px;font-weight:700;background:#f8fafc;
  padding:12px 10px;border-radius:12px;border:1px solid var(--border);transition:.2s;
}
.it:hover{transform:translateY(-3px);border-color:#cbd5e1;background:#fff}
.it img{width:100%;height:95px;object-fit:contain;margin-bottom:8px;cursor:zoom-in}
.sc .it{display:flex;align-items:center;gap:12px;text-align:left;padding:10px}
.sc .it img{width:56px;height:56px;flex:none;border-radius:8px;margin:0;background:#fff;padding:4px;border:1px solid var(--border)}

.pic{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pic .it{padding:8px}
.pic .it img{width:100%;height:190px;border-radius:8px;object-fit:cover;margin-bottom:6px}
.full{width:100%;border-radius:12px;display:block;border:1px solid var(--border);cursor:zoom-in;transition:.2s}
.full:hover{opacity:.95}

/* Layout & ROW Chips */
.lay{display:grid;grid-template-columns:2.2fr 1fr;gap:18px;align-items:center}@media(max-width:768px){.lay{grid-template-columns:1fr}}
.chip{
  position:relative;border-radius:10px;padding:8px 12px;margin:7px 0;text-align:center;
  font-weight:800;color:#0f172a;border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 5px rgba(0,0,0,.05);
  display:flex;justify-content:space-between;align-items:center;font-size:13px;
}
.chip small{font-weight:800;background:rgba(255,255,255,.65);padding:2px 8px;border-radius:6px}

/* Personil & Waktu */
.stat{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-around;align-items:center;padding:8px 0}
.time-box{display:flex;gap:16px;background:#f8fafc;padding:14px 20px;border-radius:14px;border:1px solid var(--border)}
.big{font-size:42px;font-weight:800;line-height:1;text-align:center;color:var(--blue)}
.big.left{color:var(--gold)}
.big small{display:block;font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:4px}
.pbar{width:100%;height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px}

.pie{width:120px;height:120px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative}
.pie::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.lg{font-size:13px;line-height:1.8}.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px}
.man span.tag{display:inline-block;color:#fff;padding:2px 10px;border-radius:6px;font-weight:700;font-size:11px;margin:3px 6px 3px 0}

/* Keuangan & Progress */
.keu{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fde68a;border-radius:14px;padding:16px 20px}
.keu-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #fcd34d;font-size:15px}
.keu-row:last-child{border:0}
.keu-row b{color:#92400e;font-size:12px;letter-spacing:1px}
.keu-row span{font-weight:800;color:#0f172a}

.prg{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.prg > div{background:#fff;padding:12px 8px;border-radius:10px;border:1px solid var(--border)}
.prg h4{margin:0 0 4px;font-size:12px;color:var(--muted);letter-spacing:1px}
.prg div span{font-size:22px;font-weight:800;color:var(--teal)}
.prg .dev span{color:#16a34a}
.prg .cut{grid-column:1/-1;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:8px;border:0}

/* Footer & Admin */
footer{text-align:center;padding:14px 0 40px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted);cursor:pointer;text-decoration:none;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:#fff}
footer a:hover{color:var(--ink);border-color:#cbd5e1}

.adm{display:none}.admin .adm{display:inline-block}
.admin [data-p]{outline:1px dashed var(--blue);outline-offset:2px;min-width:20px;cursor:text;border-radius:4px}
.admin [data-img]{cursor:pointer;outline:2px dashed var(--gold)}
.x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--red);color:#fff;cursor:pointer;z-index:2;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.add{margin-top:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:12.5px}
.col{width:24px;height:24px;padding:0;border:0;border-radius:6px;cursor:pointer;background:none}

#bar{position:fixed;left:0;right:0;bottom:0;background:#0f172a;color:#fff;padding:12px 24px;display:none;gap:12px;align-items:center;z-index:15;flex-wrap:wrap;border-top:2px solid var(--gold)}
.admin #bar{display:flex}
#bar button{border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer}#sv{background:var(--gold);color:#0f172a}

/* Dialogs & Lightbox */
dialog{border:0;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-width:92vw}
dialog::backdrop{background:rgba(15,23,42,.75);backdrop-filter:blur(4px)}
#dlg input{display:block;width:270px;margin:10px 0;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit}
#dlg button{padding:10px 18px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;width:100%}
#dlg small{display:block;color:var(--muted);margin-top:10px;max-width:270px;line-height:1.4}

#lb{padding:8px;background:transparent;box-shadow:none;text-align:center}
#lb img{max-width:90vw;max-height:85vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
#lb button{margin-top:10px;background:#fff;color:#0f172a;border:0;padding:8px 20px;border-radius:99px;font-weight:800;cursor:pointer}

#toast{position:fixed;top:18px;right:18px;background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:20;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,.2);border-left:4px solid var(--gold)}
</style>
</head>
<body>
<header id="hd"></header>
<nav class="qnav">
  <a href="#sec-info">📋 Informasi Umum</a>
  <a href="#sec-lingkup">🏗️ Lingkup & Desain</a>
  <a href="#sec-alat">🚜 Alat Berat & Layout</a>
  <a href="#sec-prog">📈 Progress & Keuangan</a>
  <a href="#sec-doc">📸 Dokumentasi</a>
</nav>
<main id="app"></main>
<footer><span id="mode"></span> <a id="lg">🔒 Mode Admin</a></footer>

<div id="bar">
  <b>⚡ MODE ADMIN AKTIF</b>
  <span style="opacity:.75;font-size:13px">Klik teks untuk edit · Klik gambar untuk ganti foto</span>
  <span style="flex:1"></span>
  <button id="sv">💾 Simpan Perubahan</button>
  <button id="lo">Keluar</button>
</div>

<dialog id="dlg">
  <form method="dialog" id="fm">
    <h3 style="margin-top:0">Login Admin Proyek</h3>
    <input id="u" placeholder="Username" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <button>Masuk</button>
    <small id="hint"></small>
  </form>
</dialog>

<dialog id="lb" onclick="if(event.target===this)this.close()">
  <img id="lb-img" src="" alt="Preview"><br>
  <button onclick="document.getElementById('lb').close()">✕ Tutup Preview</button>
</dialog>

<div id="toast"></div>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
  <script>
// Sistem Tab Halaman (Menampilkan hanya menu yang dipilih + tombol Semua)
const nav = document.querySelector('nav.qnav');
nav.insertAdjacentHTML('afterbegin', '<a href="#all" class="active">🌐 Semua Data</a>');

const groups = {
  '#sec-info': ['sec-info'],
  '#sec-lingkup': ['sec-lingkup', 'Lingkup Pekerjaan', 'Visualisasi Design', 'Tipikal Pekerjaan'],
  '#sec-alat': ['sec-alat', 'Alat Berat', 'Layout Pekerjaan'],
  '#sec-prog': ['sec-prog', 'Pencapaian Pekerjaan', 'Berdasarkan Kurva-S', 'Personil & Waktu', 'Progress Keuangan'],
  '#sec-doc': ['sec-doc', 'Dokumentasi']
};

function showTab(hash) {
  nav.querySelectorAll('a').forEach(a => {
    const active = a.getAttribute('href') === hash;
    a.style.background = active ? 'var(--blue)' : '';
    a.style.color = active ? '#fff' : '';
  });

  const keys = groups[hash];
  document.querySelectorAll('main > section.card').forEach(sec => {
    if (!keys || hash === '#all') {
      sec.style.display = '';
    } else {
      const match = keys.includes(sec.id) || keys.some(k => sec.textContent.includes(k));
      sec.style.display = match ? '' : 'none';
    }
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

nav.addEventListener('click', e => {
  const link = e.target.closest('a');
  if (!link) return;
  e.preventDefault();
  showTab(link.getAttribute('href'));
});
</script>
</body>
</html>
